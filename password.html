<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change Password - Safe Haven Medical Institute</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="sky">
<header class="top">
  <div class="brand"><div class="logo" aria-hidden="true">SH</div>Dr. Batumbakal</div>
  <h1>Safe Haven Medical Institute</h1>
  <nav>
    <a href="#">About Us</a>
    <a href="home.html">Home</a>
    <a href="#">Rooms</a>
    <button class="gear" id="gear" aria-label="Settings" aria-expanded="false">&#9881;</button>
    <div class="menu" id="menu" hidden>
      <a href="account.html">Account Settings</a>
      <a href="login.html">Log Out</a>
    </div>
  </nav>
</header>
<main class="card">
  <h2>You can also change your password</h2>
  <form id="pwForm" onsubmit="return false">
    <div class="field"><input class="pill" id="oldPw" type="password" placeholder="Enter old password" aria-label="Old password" autocomplete="current-password"></div>
    <div class="field"><input class="pill" id="newPw" type="password" placeholder="Enter new password" aria-label="New password" autocomplete="new-password"></div>
    <div class="field"><input class="pill" id="confirmPw" type="password" placeholder="Confirm password" aria-label="Confirm password" autocomplete="new-password"></div>
    <button class="btn" id="changeBtn" type="button">Change Password</button>
  </form>
  <p class="msg" id="msg" aria-live="polite"></p>
</main>
<script src="script.js"></script>
</body>
</html>
